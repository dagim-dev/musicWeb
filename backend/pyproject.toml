[project]
name = "tunefetch-backend"
version = "0.1.0"
description = "TuneFetch YouTube-to-MP3 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-socketio>=5.11.0",
    "yt-dlp>=2026.6.0",
    "mutagen>=1.47.0",
    "pillow>=11.0.0",
    "slowapi>=0.1.9",
    "zipstream-ng>=1.8.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
